<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12222A">
<title>Pepe Flock: Tiburones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body>
<div class="wrap">
  <header class="top">
    <div class="hero"><div><div class="kick">Pepe Flock</div>

    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="prog"><span id="pc"></span><span id="pt"></span></div>
  </header>
  <main>
    <section id="v-plan"></section>
    <section id="v-clave" hidden></section>
    <section id="v-explorar" hidden></section>
    <section id="v-estudiar" hidden></section>
    <section id="v-pendiente" hidden></section>
  </main>
</div>
<nav id="tabs" aria-label="Secciones">
  <button data-v="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v-1h6v1M9 11l2 2 4-4M9 17h6"/></svg>Plan</button>
  <button data-v="clave"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M10.5 10.5L20 20M16 16l2-2M13.5 13.5l2-2"/></svg>Clave</button>

  <button data-v="estudiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4-9 4-9-4zM7 10.5V15c0 1.5 2.5 3 5 3s5-1.500 5-3v-4.500"/></svg>Estudiar</button>
  <button data-v="pendiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M16 15l2 2 4-4"/></svg>Pendiente</button>
</nav>
<script src="js/data.js"></script>
<script src="js/sil.js"></script>
<script src="js/app.js"></script>
